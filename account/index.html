</style></head><body><main><a href="../">← <span id="back">Volver a la tienda</span></a><p class="brand">OUD BRONX</p><h1 id="heading">Tu cuenta, a tu manera</h1><p id="intro">Crear una cuenta es opcional. Puedes seguir comprando por WhatsApp sin registrarte.</p><nav id="tabs"><button type="button" data-mode="login" aria-current="true">Entrar</button><button type="button" data-mode="signup">Crear cuenta</button><button type="button" data-mode="recover">Recuperar</button></nav><form id="form"><label id="email-label" for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required maxlength="254"><div id="password-wrap"><label id="password-label" for="password">Contraseña (mínimo 6 caracteres)</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="actions"><button id="submit">Iniciar sesión</button></div></form><section id="profile" class="hidden"><p id="identity"></p><button id="logout">Cerrar sesión</button></section><p class="status" role="status" aria-live="polite" id="status"></p></main><script type="module" src="./page.js"></script></body></html>
