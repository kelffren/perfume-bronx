name: SEO checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build-organic.py
      - name: Validate generated pages and links
        run: python scripts/check-organic.py
      - name: Verify generator is deterministic
        run: |
          python scripts/build-organic.py
          git diff --exit-code -- index.html es en sitemap.xml
      - run: node --check assets/share.js
      - run: python scripts/test-indexnow.py
