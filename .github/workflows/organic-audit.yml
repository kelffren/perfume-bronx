name: Organic SEO audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate organic pages
        run: python scripts/build-organic.py
      - name: Check organic SEO
        run: |
          python scripts/check-organic.py
          python scripts/check-link-graph.py
