name: Academy cinema QA
on:
  pull_request:
    paths:
      - 'assets/academy-cinema.*'
      - 'assets/academy-media.json'
      - 'scripts/*academy-cinema*'
      - 'es/academy/khamrah/**'
      - 'en/academy/khamrah/**'
      - '.github/workflows/academy-cinema.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build-academy-cinema.py
      - run: git diff --exit-code -- es/academy/khamrah en/academy/khamrah
      - run: python scripts/check-organic.py
      - run: node scripts/test-academy-cinema.cjs
      - run: node scripts/test-organic.cjs
