<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pedidos de prueba · OUD BRONX</title><style>body{font:16px system-ui;background:#f7f6f3;color:#161616;margin:0}.wrap{max-width:950px;margin:auto;padding:32px 16px}h1{font:500 clamp(30px,5vw,50px) Georgia}.panel{background:white;padding:24px;border:1px solid #ddd;border-radius:20px;margin:20px 0}input,select,button{font:inherit;padding:11px;border:1px solid #aaa;border-radius:9px}button{background:#171717;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}#message{min-height:2em}small{color:#666}</style></head><body><main class="wrap"><a href="./">← Commerce Lab</a><h1>Gestión de reservas</h1><p>Solo pruebas locales. No acepta pagos ni confirma ventas reales.</p><section class="panel"><h2>Conexión local</h2><label>Token de administrador <input id="token" type="password" autocomplete="off" placeholder="Token del servidor"></label><button id="connect">Conectar y actualizar</button><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>Reservar inventario</h2><label>Producto <select id="sku"></select></label><label>Cantidad <input id="quantity" type="number" min="1" max="20" value="1"></label><button id="reserve">Crear reserva de prueba</button></section><section class="panel"><h2>Reservas y borradores</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Estado</th><th>Artículos</th><th>Acción</th></tr></thead><tbody id="orders"></tbody></table></div></section></main><script type="module">
const $=id=>document.getElementById(id),api="http://127.0.0.1:8765";
if(!["localhost","127.0.0.1"].includes(location.hostname)){$("message").textContent="Este panel solo funciona servido desde localhost";$("connect").disabled=true;$("reserve").disabled=true}
async function request(path,method="GET",body){const r=await fetch(api+path,{method,headers:{"X-OUD-Admin-Token":$("token").value,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||"Error de servidor");return data}
async function refresh(){
 const products=(await request("/admin/catalog")).products;
 $("sku").replaceChildren(...products.map(p=>{const o=document.createElement("option");o.value=p.sku;o.textContent=p.name+" · $"+p.price+" · stock "+p.stock;return o}));
 const orders=await request("/orders");$("orders").replaceChildren(...orders.map(o=>{
 const tr=document.createElement("tr");for(const val of [o.id,o.status,o.items.map(i=>i.quantity+" × "+i.sku).join(", ")]){const td=document.createElement("td");td.textContent=val;tr.append(td)}
 const action=document.createElement("td");if(o.status==="reserved-test"){const b=document.createElement("button");b.textContent="Cancelar y devolver stock";b.onclick=async()=>{if(!confirm("¿Cancelar esta reserva de prueba?"))return;try{await request("/admin/reservations/"+encodeURIComponent(o.id)+"/cancel","POST");await refresh();$("message").textContent="Reserva cancelada"}catch(e){$("message").textContent=e.message}};action.append(b)}tr.append(action);return tr
 }));$("message").textContent="Catálogo y pedidos actualizados"}
$("connect").onclick=()=>refresh().catch(e=>$("message").textContent=e.message);
$("reserve").onclick=async()=>{const quantity=Number($("quantity").value);if(!Number.isInteger(quantity)||quantity<1||quantity>20){$("message").textContent="Cantidad inválida";return}try{await request("/admin/reservations","POST",{items:[{sku:$("sku").value,quantity}]});await refresh();$("message").textContent="Reserva de prueba creada"}catch(e){$("message").textContent=e.message}};
</script></body></html>
