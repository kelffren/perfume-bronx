<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Catálogo de pruebas · OUD BRONX</title><style>body{margin:0;background:#f7f7f5;color:#111;font:15px/1.6 system-ui}.wrap{max-width:900px;margin:auto;padding:40px 20px}h1{font:500 48px Georgia}table{border-collapse:collapse;width:100%;background:#fff;border-radius:15px}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}input{width:90px;padding:10px;border:1px solid #ccc;border-radius:8px}button{background:#111;color:#fff;border:0;border-radius:25px;padding:12px 20px;cursor:pointer}.muted{color:#666}.scroll{overflow-x:auto}a{color:inherit}</style></head><body><main class="wrap"><a href="./">← Commerce Lab</a><h1>Catálogo de pruebas</h1><p class="muted">Editor de pruebas. En modo SQLite, los cambios se guardan en tu computadora mediante un token local. No modifica la tienda pública. No introducir información de clientes.</p><p><label>Modo de almacenamiento <select id="backend"><option value="local">Navegador</option><option value="sqlite">SQLite local</option></select></label> <label>Token de administrador local <input id="token" type="password" autocomplete="off" placeholder="Token del servidor"></label> <button id="load">Cargar catálogo</button></p><div class="scroll"><table><thead><tr><th>Producto</th><th>Precio USD</th><th>Stock</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div><p id="status" role="status" aria-live="polite"></p></main><script type="module">
import {initCatalog,updateProduct} from "./catalog.js";
import {mode} from "./config.js";
const $=id=>document.getElementById(id);
$("backend").value=mode==="sqlite"?"sqlite":"local";
async function load(){
 const sqlite=$("backend").value==="sqlite";
 if(sqlite && !["localhost","127.0.0.1"].includes(location.hostname))throw Error("Admin SQLite solo desde localhost");
 if(!sqlite)return initCatalog();
 const r=await fetch("http://127.0.0.1:8765/admin/catalog",{headers:{"X-OUD-Admin-Token":$("token").value}});
 if(!r.ok)throw Error("Servidor o autorización local no disponible");
 return (await r.json()).products;
}
async function render(){
 const products=await load();$("rows").replaceChildren();
 for(const p of products){
 const tr=document.createElement("tr"),name=document.createElement("td"),priceCell=document.createElement("td"),stockCell=document.createElement("td"),action=document.createElement("td"),price=document.createElement("input"),stock=document.createElement("input"),save=document.createElement("button");
 name.textContent=p.name;price.type="number";price.min="0";price.step=".01";price.value=p.price;stock.type="number";stock.min="0";stock.step="1";stock.value=p.stock;save.textContent="Guardar";
 save.onclick=async()=>{try{const changes={price:Number(price.value),stock:Number(stock.value)};if($("backend").value==="sqlite"){
 const r=await fetch("http://127.0.0.1:8765/admin/products/"+encodeURIComponent(p.sku),{method:"PUT",headers:{"Content-Type":"application/json","X-OUD-Admin-Token":$("token").value},body:JSON.stringify(changes)});
 if(!r.ok)throw Error("No se pudo guardar en SQLite");
 }else updateProduct(p.sku,changes);
 $("status").textContent="Guardado: "+p.name;
 }catch(e){$("status").textContent=e.message}};
 priceCell.append(price);stockCell.append(stock);action.append(save);tr.append(name,priceCell,stockCell,action);$("rows").append(tr);
 }}
$("load").onclick=()=>render().catch(e=>$("status").textContent=e.message);
if($("backend").value==="local")render().catch(e=>$("status").textContent=e.message);
</script></body></html>
