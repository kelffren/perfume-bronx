<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Catálogo de pruebas · OUD BRONX</title><style>body{margin:0;background:#f7f7f5;color:#111;font:15px/1.6 system-ui}.wrap{max-width:900px;margin:auto;padding:40px 20px}h1{font:500 48px Georgia}table{border-collapse:collapse;width:100%;background:#fff;border-radius:15px}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}input{width:90px;padding:10px;border:1px solid #ccc;border-radius:8px}button{background:#111;color:#fff;border:0;border-radius:25px;padding:12px 20px;cursor:pointer}.muted{color:#666}.scroll{overflow-x:auto}a{color:inherit}</style></head><body><main class="wrap"><a href="./">← Commerce Lab</a><h1>Catálogo de pruebas</h1><p class="muted">Editor local de precios y existencias. Los cambios se guardan únicamente en este navegador y NO modifican la tienda pública ni la base SQLite. No introducir información de clientes.</p><div class="scroll"><table><thead><tr><th>Producto</th><th>Precio USD</th><th>Stock</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div><p id="status" role="status" aria-live="polite"></p></main><script type="module">import {initCatalog,updateProduct} from "./catalog.js";const rows=document.getElementById("rows"),status=document.getElementById("status");for(const p of await initCatalog()){const tr=document.createElement("tr"),name=document.createElement("td"),priceCell=document.createElement("td"),stockCell=document.createElement("td"),action=document.createElement("td"),price=document.createElement("input"),stock=document.createElement("input"),save=document.createElement("button");name.textContent=p.name;price.type="number";price.min="0";price.step=".01";price.value=p.price;price.setAttribute("aria-label","Precio de "+p.name);stock.type="number";stock.min="0";stock.step="1";stock.value=p.stock;stock.setAttribute("aria-label","Existencias de "+p.name);save.textContent="Guardar";save.onclick=()=>{try{updateProduct(p.sku,{price:Number(price.value),stock:Number(stock.value)});status.textContent="Guardado localmente: "+p.name}catch(e){status.textContent=e.message}};priceCell.append(price);stockCell.append(stock);action.append(save);tr.append(name,priceCell,stockCell,action);rows.append(tr)}</script></body></html>
