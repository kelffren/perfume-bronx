<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Commerce Lab · OUD BRONX</title><style>body{font:16px system-ui;background:#faf9f7;color:#171717;margin:0}.wrap{max-width:740px;margin:60px auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:22px;padding:25px;margin:18px 0}button,select{padding:12px 18px;border-radius:12px;font:inherit}button{background:#111;color:white;border:0}label{display:block;margin:12px 0}small{color:#666}</style><main class="wrap"><a href="/perfume-bronx/">← OUD BRONX</a><h1>Commerce Lab</h1><p>Entorno de pruebas del núcleo comercial. Los pedidos locales solo se guardan en este navegador; no son pedidos confirmados.</p><section class="card"><h2>Motor de almacenamiento</h2><label for="backend">Modo</label><select id="backend"><option value="local">Local — navegador, sin servidor</option><option value="cloud">Cloud — API privada</option></select><p id="status" role="status"></p><small>El cambio es manual. No se migran datos entre modos automáticamente.</small></section><section class="card"><h2>Pedido de prueba</h2><label>Perfume <select id="sku"><option value="yara">Lattafa Yara · $25</option><option value="khamrah">Lattafa Khamrah · $35</option><option value="asad">Lattafa Asad · $35</option></select></label><label>Cantidad <input id="qty" type="number" min="1" max="20" value="1"></label><button id="save">Guardar borrador</button><p id="result" role="status"></p></section><section class="card"><h2>Borradores</h2><button id="refresh">Actualizar</button><ul id="orders"></ul></section></main><script type="module">import {mode,setMode} from "./config.js";import {createOrder,listOrders} from "./store.js";const $=id=>document.getElementById(id);$("backend").value=mode;$("backend").onchange=e=>setMode(e.target.value);$("status").textContent=mode==="local"?"Modo local activo: almacenamiento solo en este dispositivo.":"Modo cloud seleccionado: requiere API autenticada configurada.";$("save").onclick=async()=>{const sku=$("sku").value,quantity=Number($("qty").value);if(!Number.isInteger(quantity)||quantity<1||quantity>20)return $("result").textContent="Cantidad inválida";try{const order=await createOrder({items:[{sku,quantity,unitPrice:sku==="yara"?25:35}]});$("result").textContent="Borrador guardado: "+order.id;await refresh()}catch(e){$("result").textContent=e.message}};async function refresh(){try{const rows=await listOrders();$("orders").replaceChildren(...rows.map(o=>{const li=document.createElement("li");li.textContent=o.id+" · "+o.items.map(i=>i.quantity+" × "+i.sku).join(", ");return li}))}catch(e){$("orders").textContent=e.message}}$("refresh").onclick=refresh;refresh();</script></html>
